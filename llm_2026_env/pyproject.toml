[project]
name = "llm-2026-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rupak Roy", email = "rupak2007bob1@yahoo.co.in" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.10.18",
    "mcp>=2.0.0",
    "nltk>=3.10.3",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "sentence-transformers>=5.7.0",
    "slowapi>=0.1.10",
    "torch>=2.13.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
llm-2026-env = "llm_2026_env:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
